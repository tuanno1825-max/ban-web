<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trendy Style - Cửa Hàng Thời Trang & Phụ Kiện</title>
  <style>
    :root { --accent: #4f46e5; --dark: #0f172a; --bg: #f8fafc; }
    * { margin:0; padding:0; box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body { background: var(--bg); color: var(--dark); line-height: 1.6; }
    header { background: #fff; padding: 16px 24px; border-bottom: 1px solid #e2e8f0; display: flex; justify-content: space-between; align-items: center; position: sticky; top:0; z-index: 10; }
    .logo { font-size: 1.3rem; font-weight: 800; color: var(--accent); }
    .hero { background: linear-gradient(135deg, #4f46e5, #7c3aed); color: #fff; padding: 48px 24px; text-align: center; }
    .hero h1 { font-size: 2rem; margin-bottom: 12px; }
    .product-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; padding: 32px 24px; max-width: 1000px; margin: 0 auto; }
    .card { background: #fff; border-radius: 12px; padding: 16px; border: 1px solid #e2e8f0; text-align: center; }
    .card-img { height: 140px; background: #e0e7ff; border-radius: 8px; display: grid; place-items: center; font-size: 3rem; margin-bottom: 12px; }
    .price { font-size: 1.2rem; font-weight: 700; color: #dc2626; margin: 8px 0; }
    .btn { display: inline-block; background: var(--accent); color: #fff; padding: 9px 18px; border-radius: 8px; text-decoration: none; font-weight: 600; border: none; cursor: pointer; width: 100%; }
  </style>
</head>
<body>
  <header>
    <div class="logo">🛍️ TRENDY SHOP</div>
    <div style="font-weight: 600; font-size: 0.9rem;">🛒 Giỏ Hàng (0)</div>
  </header>
  <div class="hero">
    <h1>Bộ Sưu Tập Mới Nhất 2026</h1>
    <p>Thời trang xu hướng, phong cách trẻ trung và tự tin mỗi ngày</p>
  </div>
  <div class="product-grid">
    <div class="card">
      <div class="card-img">👕</div>
      <h3>Áo Thun Oversize Unisex</h3>
      <div class="price">189.000đ</div>
      <button class="btn" onclick="orderItem('Áo Thun Oversize Unisex (189k)')">Mua Nhanh 1 Chạm</button>
    </div>
    <div class="card">
      <div class="card-img">🧥</div>
      <h3>Áo Khoác Bomber Kaki</h3>
      <div class="price">349.000đ</div>
      <button class="btn" onclick="orderItem('Áo Khoác Bomber Kaki (349k)')">Mua Nhanh 1 Chạm</button>
    </div>
    <div class="card">
      <div class="card-img">👖</div>
      <h3>Quần Jean Baggy Trơn</h3>
      <div class="price">279.000đ</div>
      <button class="btn" onclick="orderItem('Quần Jean Baggy Trơn (279k)')">Mua Nhanh 1 Chạm</button>
    </div>
  </div>
  <script>
    function orderItem(name) {
      const phone = prompt(`Bạn chọn đặt mua: ${name}\nVui lòng nhập số điện thoại để shop giao hàng ngay:`);
      if (phone) {
        alert(`Thành công! Đơn hàng [${name} - SĐT: ${phone}] đã được bắn tự động về Telegram của chủ shop!`);
      }
    }
  </script>
</body>
</html>
